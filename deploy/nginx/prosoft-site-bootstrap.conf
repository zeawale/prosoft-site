# nginx для ПРО-СОФТ: временный конфиг до выпуска сертификатов.
# Только http: боевой конфиг ссылается на файлы сертификатов, и без них
# nginx не стартует. Нужен, чтобы certbot прошёл проверку домена.
# После certbot заменить на prosoft-site.conf (см. deploy/README.md).
#
# default_server здесь нет: он у pm52.ru, сервер общий.

upstream prosoft_site {
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name xn----0tbbbfiip.xn--p1ai www.xn----0tbbbfiip.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20m;

    location / {
        include /etc/nginx/snippets/prosoft-site-proxy.conf;
    }
}
