# nginx для ПРО-СОФТ: боевой конфиг, после выпуска сертификатов.
# Кладётся в /etc/nginx/sites-available/prosoft-site.conf, ссылка в sites-enabled.
#
# Канонический адрес здесь https://про-софт.рф (xn----0tbbbfiip.xn--p1ai), а
# 1cprosoft.ru сводится на него. Решение ждёт Дмитрия: если выберет наоборот,
# поменять имена местами и NEXT_PUBLIC_SITE_URL в .env, затем пересобрать.
#
# http → https и www → без www сводит приложение (src/proxy.ts) одним
# переходом. Сам nginx редиректит только то, мимо чего proxy проходит по
# матчеру: /api, /admin, /_next и пути с точкой.
#
# `listen ... http2`, а не `http2 on`: в Ubuntu 24.04 nginx 1.24.

upstream prosoft_site {
    server 127.0.0.1:3002;
    keepalive 16;
}

map $uri $prosoft_static_path {
    default                       0;
    ~^/(api|admin|_next)(/|$)     1;
    ~\.[^/]+$                     1;
}

# ---- про-софт.рф и www, http ----
server {
    listen 80;
    listen [::]:80;
    server_name xn----0tbbbfiip.xn--p1ai www.xn----0tbbbfiip.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($prosoft_static_path) {
            return 301 https://xn----0tbbbfiip.xn--p1ai$request_uri;
        }
        include /etc/nginx/snippets/prosoft-site-proxy.conf;
    }
}

# ---- www.про-софт.рф, https ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.xn----0tbbbfiip.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn----0tbbbfiip.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----0tbbbfiip.xn--p1ai/privkey.pem;

    location / {
        if ($prosoft_static_path) {
            return 301 https://xn----0tbbbfiip.xn--p1ai$request_uri;
        }
        include /etc/nginx/snippets/prosoft-site-proxy.conf;
    }
}

# ---- про-софт.рф, https: канонический адрес ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn----0tbbbfiip.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn----0tbbbfiip.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----0tbbbfiip.xn--p1ai/privkey.pem;

    # Загрузка картинок в админке: по умолчанию nginx режет тело на 1 МБ
    client_max_body_size 20m;

    # Сборка Next: имена файлов с хешем, кешировать можно надолго
    location /_next/static/ {
        include /etc/nginx/snippets/prosoft-site-proxy.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/prosoft-site-proxy.conf;
    }
}

# ---- 1cprosoft.ru: второй домен, путь сохраняем ----
server {
    listen 80;
    listen [::]:80;
    server_name 1cprosoft.ru www.1cprosoft.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://xn----0tbbbfiip.xn--p1ai$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 1cprosoft.ru www.1cprosoft.ru;

    ssl_certificate     /etc/letsencrypt/live/1cprosoft.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1cprosoft.ru/privkey.pem;

    return 301 https://xn----0tbbbfiip.xn--p1ai$request_uri;
}
